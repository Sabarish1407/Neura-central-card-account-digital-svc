server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: Neura-central-card-account-digital-svc-demo
  datasource:
    url: jdbc:h2:mem:carddemodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

banking:
  security:
    # Demo-only non-production card encryption key (AES-256 Base64). Never use in production!
    card-encryption-key: c2VjdXJlX2JhbmtpbmdfY2FyZF9rZXlfMjAyNl9hZXM= # gitleaks:allow

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
