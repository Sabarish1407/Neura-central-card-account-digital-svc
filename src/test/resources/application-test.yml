server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: Neura-central-card-account-digital-svc-test
  datasource:
    url: jdbc:h2:mem:cardtestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

banking:
  security:
    card-encryption-key: c2VjdXJlX2JhbmtpbmdfY2FyZF9rZXlfMjAyNl9hZXM= # gitleaks:allow
